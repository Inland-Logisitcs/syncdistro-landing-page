site:
  name: SyncDistro
  # Despliegue actual: GitHub Pages como "project site" del repositorio
  # Inland-Logisitcs/syncdistro-landing-page, servido en
  # https://inland-logisitcs.github.io/syncdistro-landing-page/
  #
  # Si más adelante se usa un dominio propio (p. ej. syncdistro.com), hay que
  # cambiar `site` a ese dominio, poner `base: '/'` y añadir el archivo
  # `public/CNAME` con el dominio.
  site: 'https://inland-logisitcs.github.io'
  base: '/syncdistro-landing-page'
  # GitHub Pages sirve cada página como `ruta/index.html`, es decir con barra
  # final, y redirige con 301 la versión sin barra. Con `true` los enlaces y las
  # URLs canónicas se generan ya con barra final: se evita ese redirect y el
  # servidor de desarrollo puede servir la home cuando hay un `base`
  # (`trailingSlash: false` se traduce a 'never' en Astro y ahí da 404).
  trailingSlash: true

  googleSiteVerificationId: ''

# Metadata SEO por defecto
metadata:
  title:
    default: SyncDistro — Gestión comercial en campo
    template: '%s — SyncDistro'
  description: 'SyncDistro digitaliza la gestión de clientes, rutas, visitas comerciales y pedidos de los vendedores en campo, e integra las órdenes con tu ERP.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: SyncDistro
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    cardType: summary_large_image

i18n:
  language: es
  textDirection: ltr

apps:
  blog:
    isEnabled: false

analytics:
  vendors:
    googleAnalytics:
      id: null # o "G-XXXXXXXXXX"

ui:
  theme: 'system' # Valores: "system" | "light" | "dark" | "light:only" | "dark:only"
