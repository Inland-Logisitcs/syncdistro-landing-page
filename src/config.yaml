site:
  name: SyncDistro
  # Despliegue actual: GitHub Pages con dominio propio, servido en
  # https://syncdistro.syncfreight.com/
  #
  # Con dominio propio el sitio vive en la RAÍZ, así que `base` tiene que ser
  # '/'. Si se dejara el `base` del "project site" (`/syncdistro-landing-page`),
  # el HTML pediría los assets desde ese subdirectorio, que en el dominio propio
  # no existe: el sitio carga sin estilos. El dominio va además en `public/CNAME`
  # para que sobreviva a los despliegues.
  site: 'https://syncdistro.syncfreight.com'
  base: '/'
  # GitHub Pages sirve cada página como `ruta/index.html`, es decir con barra
  # final, y redirige con 301 la versión sin barra. Con `true` los enlaces y las
  # URLs canónicas se generan ya con barra final y se evita ese redirect.
  trailingSlash: true

  googleSiteVerificationId: ''

# Metadata SEO por defecto
metadata:
  title:
    default: SyncDistro — Gestión comercial en campo
    template: '%s — SyncDistro'
  description: 'SyncDistro digitaliza la gestión de clientes, rutas, visitas comerciales y pedidos de los vendedores en campo, e integra las órdenes con tu ERP.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: SyncDistro
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    cardType: summary_large_image

i18n:
  language: es
  textDirection: ltr

apps:
  blog:
    isEnabled: false

analytics:
  vendors:
    googleAnalytics:
      id: null # o "G-XXXXXXXXXX"

ui:
  theme: 'system' # Valores: "system" | "light" | "dark" | "light:only" | "dark:only"
